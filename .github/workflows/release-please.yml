name: Release Please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Configured by release-please-config.json and .release-please-manifest.json
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.BOT_PAT }}
